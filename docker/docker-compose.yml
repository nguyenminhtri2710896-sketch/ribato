networks:
  frontend:
    driver: ${NETWORKS_DRIVER}
  backend:
    driver: ${NETWORKS_DRIVER}
volumes:
  memcached:
    driver: ${VOLUMES_DRIVER}
  redis:
    driver: ${VOLUMES_DRIVER}
  mariadb:
    driver: ${VOLUMES_DRIVER}

services:
## Workspace Utilities ##################################
    workspace:
      restart: always
      cap_add:
      - NET_ADMIN
      - SYS_MODULE
      dns:
      - 8.8.8.8
      - 8.8.4.4
      build:
        context: ./workspace
        args:
          - PHP_VERSION=${PHP_VERSION}
      devices:
        - /dev/net/tun:/dev/net/tun
      volumes:
        - ${PATH_HOST}:${PATH_CONTAINER}
        - ./workspace/crontab/:/etc/cron.d/crontab
        - ./workspace/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf
        - ./workspace/supervisor/conf.d:/etc/supervisor/conf.d
        # - ./workspace/wireguard/config:/etc/wireguard
        # - ./workspace/wireguard/config/wg0.conf:/etc/wireguard/wg0.conf:ro
      extra_hosts:
        - "dockerhost:${DOCKER_HOST_IP}"
      # # tty: true
      # ports:
      #   - "8383:8383"
      #   - "888:888"
      environment:
        - TZ=${TIMEZONE}
      networks:
        - frontend
        - backend
        
### PHP-FPM ##############################################
    php-fpm:
      restart: always
      cap_add:
      - NET_ADMIN
      - SYS_MODULE
      dns:
        - 8.8.8.8
        - 8.8.4.4
      devices:
        - /dev/net/tun:/dev/net/tun
      build:
        context: ./php-fpm
        args:
          - PHP_VERSION=${PHP_VERSION}
          - http_proxy
          - https_proxy
          - no_proxy
      volumes:
        - ./php-fpm/php/php${PHP_VERSION}.ini:/etc/php/${PHP_VERSION}/fpm/php.ini
        - ./php-fpm/pool.d:/etc/php/${PHP_VERSION}/fpm/pool.d/
        - ${PATH_HOST}:${PATH_CONTAINER}
        - ./workspace/wireguard/config:/etc/wireguard
      extra_hosts:
        - "dockerhost:${DOCKER_HOST_IP}"
      environment:
        - TZ=${TIMEZONE}
        - PHP_VERSION=${PHP_VERSION}
      depends_on:
        - workspace
      networks:
        - backend

### NGINX Server #########################################
    nginx:
      restart: always
      build:
        context: ./nginx
        args:
          - PHP_UPSTREAM_CONTAINER=${NGINX_PHP_UPSTREAM_CONTAINER}
          - PHP_UPSTREAM_PORT=${NGINX_PHP_UPSTREAM_PORT}
          - http_proxy
          - https_proxy
          - no_proxy
      volumes:
        - ${PATH_HOST}:${PATH_CONTAINER}
        - ./nginx/conf.d/:/etc/nginx/conf.d/
      ports:
        - "${NGINX_HOST_HTTP_PORT}:80"
        - "${NGINX_HOST_HTTPS_PORT}:443"
      depends_on:
        - php-fpm
      networks:
        - frontend
        - backend


# ### MariaDB ##############################################
    mariadb:
      restart: always
      build:
        context: ./mariadb
        args:
          - http_proxy
          - https_proxy
          - no_proxy
          - MARIADB_VERSION=${MARIADB_VERSION}
      volumes:
        - ${DATA_PATH_HOST}/mariadb:/var/lib/mysql
        - ${MARIADB_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
      ports:
        - "${MARIADB_PORT}:3306"
      environment:
        - TZ=${TIMEZONE}
        - MYSQL_DATABASE=${MARIADB_DATABASE}
        - MYSQL_USER=${MARIADB_USER}
        - MYSQL_PASSWORD=${MARIADB_PASSWORD}
        - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      networks:
        - backend

  ### Redis ################################################
    redis:
      restart: always
      build: ./redis
      volumes:
        - ${DATA_PATH_HOST}/redis:/data
      command: --requirepass ${REDIS_PASSWORD}
      ports:
        - "${REDIS_PORT}:6379"
      networks:
        - backend

# ### Memcached ############################################
    memcached:
      restart: always
      build: ./memcached
      volumes:
        - ${DATA_PATH_HOST}/memcached:/var/lib/memcached
      ports:
        - "${MEMCACHED_HOST_PORT}:11211"
      depends_on:
        - php-fpm
      networks:
        - backend